name: Docker

on:
  workflow_call:

env:
  PROJECT_NAME: "leoxy"
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME || secrets.DOKCER_USERNAME }}
  DOCKER_ACCESS_TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}

jobs:
  image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/stable/Dockerfile
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Image summary
        run: |
          echo "# . 🦐 elrefai99 projects ." >> $GITHUB_STEP_SUMMARY
          echo "## 🐳 Docker Image Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Completed build image successfully" >> $GITHUB_STEP_SUMMARY

  compose:
    runs-on: ubuntu-latest
    needs: image

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose -f ./docker/stable/docker-compose.yml config --quiet

      - name: Build Compose services
        run: docker compose -f ./docker/stable/docker-compose.yml build

      - name: Build Compose summary
        run: |
          echo "# . 🦐 elrefai99 projects ." >> $GITHUB_STEP_SUMMARY
          echo "## 🐳 Docker Compose Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Completed build compose successfully" >> $GITHUB_STEP_SUMMARY

  push:
    runs-on: ubuntu-latest
    needs: [image, compose]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Decide
        id: meta
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_ACCESS_TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}
        run: |
          version=$(jq -r '.version' version.json)
          previous=$(git show "${GITHUB_SHA}^:version.json" 2>/dev/null | jq -r '.version' || true)
          push=false
          if [ "$version" != "$previous" ] && [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_ACCESS_TOKEN" ]; then
            push=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "push=$push" >> "$GITHUB_OUTPUT"
      - if: steps.meta.outputs.push == 'true'
        uses: docker/setup-qemu-action@v3
      - if: steps.meta.outputs.push == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      - if: steps.meta.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/stable/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.PROJECT_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.PROJECT_NAME }}:${{ steps.meta.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.PROJECT_NAME }}:${{ github.sha }}
          build-args: |
            LEOXY_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        run: |
          echo "## Docker Hub" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pushed: ${{ steps.meta.outputs.push }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ steps.meta.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
