name: Feature request
description: Propose a new capability or improvement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, and what is the impact?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Expected behavior, including config keys or CLI flags if relevant
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Routing
        - Load balancing
        - Rate limiting
        - Auth / security
        - TCP / UDP
        - WebSocket / GraphQL / HTTP/3
        - Observability (metrics / logs)
        - CLI
        - Docker / deployment
        - Docs
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds, or how Nginx, Envoy, or Traefik handle this
  - type: dropdown
    id: contribute
    attributes:
      label: Willing to contribute a PR?
      options:
        - "Yes"
        - "No"
        - Maybe, with guidance
    validations:
      required: true
