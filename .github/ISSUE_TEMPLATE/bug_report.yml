name: Bug report
description: Report incorrect behavior in Leoxy
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Redact jwt_secret, api_keys, redis_password, and private upstream URLs before pasting anything. Vulnerabilities go through SECURITY.md, not this form.
  - type: input
    id: version
    attributes:
      label: Leoxy version
      description: Output of `leoxy version`
      placeholder: leoxy v1.12.2
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Binary (foreground)
        - Binary (leoxy start / restart)
        - Docker
        - Docker Compose
        - Systemd
        - PM2
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS / architecture
      options:
        - Linux amd64
        - Linux arm64
        - Windows amd64
        - Windows arm64
        - macOS
        - Other
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - HTTP routing / path prefix
        - Load balancing / failover
        - Rate limiting (memory)
        - Rate limiting (Redis)
        - Auth (API key / JWT / mTLS)
        - CIDR / trusted proxy / client IP
        - Body size limits
        - TCP proxy
        - UDP proxy
        - WebSocket / GraphQL
        - Health / metrics
        - Config loading / env overrides
        - Logging
        - CLI (start / stop / restart / version)
        - Docker image
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Relevant part of leoxy/config.yaml, redacted, plus env overrides in use (PORT, RATE_LIMIT, LEOXY_HOST, ...)
      render: yaml
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: leoxy/log/leoxy.log, log/request.log, log/error.log, or `docker logs`, redacted
      render: text
