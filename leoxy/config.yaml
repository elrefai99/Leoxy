server:
  port: "8080"
  security:
    rate_limit: 100
    rate_limit_burst: 20
    global_rate_limit: 1000
    global_rate_burst: 100
    max_body: 10
    allowed_methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    trusted_proxy_cidrs: []

upstream:
  - name: "Backend"
    path: /api
    ip: true
    body: 10 # By MB only
    servers:
      - "http://localhost:60459"
      - "http://localhost:60460"
    security:
      route_rate_limit: 100
      route_rate_burst: 20

  - name: "Frontend"
    path: /
    server_url: "http://localhost:3000"
