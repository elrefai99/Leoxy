services:
  leoxy:
    build:
      context: ../..
      dockerfile: docker/alpine/Dockerfile

    image: ghcr.io/mohamed0699/leoxy:latest
    restart: unless-stopped
    init: true

    ports:
      - "${LEOXY_PORT:-80}:80"

    environment:
      PORT: 80
      LEOXY_HOST: 0.0.0.0

    volumes:
      - ./leoxy:/app/leoxy
      - leoxy-log:/app/log

    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"

    cap_drop:
      - ALL

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:80/health/live
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

    stop_grace_period: 10s

volumes:
  leoxy-log:
