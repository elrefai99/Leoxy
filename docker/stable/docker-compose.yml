name: leoxy

services:
  leoxy:
    build:
      context: ../..
      dockerfile: docker/stable/Dockerfile
      args:
        LEOXY_VERSION: ${LEOXY_VERSION:-1.14.3}
    image: ${LEOXY_IMAGE:-mohamed0699/leoxy}:${LEOXY_TAG:-latest}
    user: "${LEOXY_UID:-10001}:${LEOXY_GID:-10001}"
    restart: unless-stopped
    init: true
    ports:
      - "${LEOXY_PORT:-80}:80"
    environment:
      PORT: "80"
      LEOXY_HOST: 0.0.0.0
      GOMEMLIMIT: 400MiB
      API_KEYS: ${API_KEYS:-}
      JWT_SECRET: ${JWT_SECRET:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - ./leoxy:/app/leoxy
      - leoxy-log:/app/log
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    mem_limit: 512m
    pids_limit: 512
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:$${PORT:-80}/health/live || exit 1",
        ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  leoxy-log:
