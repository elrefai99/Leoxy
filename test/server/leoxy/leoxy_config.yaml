server:
  host: "127.0.0.1"
  port: "80"

  timeout:
    connect: 5
    read: 30
    write: 30
    idle: 60
    request: 60

  logging:
    skip_paths: ["/node_modules"]

  security:
    global_rate_limit: 1000
    global_rate_burst: 1000
    max_body: 10
    max_conns_per_ip: 1
    require_mtls: false
    allowed_methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    trusted_proxy_cidrs: []
    internal_cidrs: []
    redis_connect: 22

watcher:
  status: "on"
  project_name: "test"
  memory_limit_mb: 500
  interval_seconds: 10
  cooldown_seconds: 30
  heap_profile: true
  webhook_url: "https://webhook.site/3aad78b1-aff8-4dce-9b3b-a19e6838a052"

upstream:
  - name: "Backend"
    path: /api
    ip: true
    body: 10
    servers:
      - "http://localhost:9000"
    security:
      rate_limit: 1000
      rate_limit_burst: 500
      route_rate_limit: 1000
      route_rate_burst: 500
