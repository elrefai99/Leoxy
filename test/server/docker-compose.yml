services:
  node:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: 9000

  leoxy:
    image: mohamed0699/leoxy:latest
    ports:
      - "80:80"
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ./leoxy:/app/leoxy
    depends_on:
      - node
